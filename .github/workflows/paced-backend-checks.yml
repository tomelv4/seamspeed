name: PACED backend checks

on:
  push:
    branches:
      - "paced/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  biomechanics-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install biomechanics test dependencies
        run: python -m pip install --upgrade pip numpy pytest pytest-xdist opencv-python-headless
      - name: Compile backend modules
        run: python -m compileall -q backend
      - name: Run biomechanics unit tests
        run: pytest -c backend/pytest.ini -n 0 backend/tests/test_biomech_unit.py
